<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="keywords" content="颐贞,Eregen,老年健康,智能手环,药盒管理,居家养老,健康监测">
  <meta name="author" content="Eregen Team">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ .Title }} - {{ .Site.Title }}">
  <meta property="og:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:image" content="https://eregen.com/images/hero-preview.jpg">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Params.brandName }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }} - {{ .Site.Title }}">
  <meta name="twitter:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="https://eregen.com/images/hero-preview.jpg">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Eregen Visual Redesign CSS (参考：curative.com) -->
  <style>
/* Eregen 品牌官网 — 视觉改版样式 */
:root {
  --bg: #FAFAF9;
  --surface: #FFFFFF;
  --surface-alt: #F5F5F4;
  --text-primary: #1C1917;
  --text-secondary: #57534E;
  --text-tertiary: #78716C;
  --border: #E7E5E4;
  --border-strong: #D6D3D1;
  --primary: #0F766E;
  --primary-light: #CCFBF1;
  --primary-dark: #115E59;
  --primary-50: #F0FDFA;
  --success: #059669;
  --success-light: #D1FAE5;
  --warning: #D97706;
  --warning-light: #FEF3C7;
  --danger: #DC2626;
  --danger-light: #FEE2E2;
  --info: #0284C7;
  --info-light: #E0F2FE;
  --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  --font-serif: 'Noto Serif SC', Georgia, serif;
  --font-mono: 'JetBrains Mono', 'Menlo', monospace;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08), 0 4px 8px rgba(0,0,0,0.04);
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); line-height: 1.6; font-size: 15px; }
img { max-width: 100%; display: block; } a { color: inherit; text-decoration: none; } ul { list-style: none; } button { font-family: inherit; cursor: pointer; border: none; background: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* Navigation */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.97); border-bottom: 1px solid var(--border); backdrop-filter: blur(8px); transition: box-shadow var(--transition-base); }
.nav.scrolled { box-shadow: var(--shadow-sm); }
.nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
.nav-brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-primary); }
.nav-logo { width: 34px; height: 34px; border: 1.5px solid var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 16px; font-weight: 700; font-family: var(--font-serif); background: var(--primary-50); transition: all var(--transition-fast); }
.nav-brand:hover .nav-logo { background: var(--primary); color: white; }
.nav-name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.nav-name span { color: var(--primary); }
.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a { font-size: 14px; font-weight: 500; color: var(--text-secondary); transition: color var(--transition-fast); position: relative; padding: 4px 0; }
.nav-links a:hover, .nav-links a.active { color: var(--primary); }
.nav-links a.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 1.5px; background: var(--primary); border-radius: 1px; }
.nav-actions { display: flex; gap: 10px; align-items: center; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; transition: all var(--transition-fast); text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--primary); color: white; border: 1.5px solid var(--primary); }
.btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,118,110,0.25); }
.btn-outline { background: transparent; color: var(--text-secondary); border: 1.5px solid var(--border-strong); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-lg { padding: 12px 28px; font-size: 15px; border-radius: var(--radius-md); }
.btn-white { background: white; color: var(--primary); font-weight: 700; border: 1.5px solid white; }
.btn-white:hover { background: var(--primary-50); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-ghost { background: rgba(255,255,255,0.12); color: white; border: 1.5px solid rgba(255,255,255,0.35); }
.btn-ghost:hover { background: rgba(255,255,255,0.22); }

/* Sections */
.section { padding: 96px 0; }
.section-alt { background: var(--surface-alt); }
.section-header { text-align: center; margin-bottom: 64px; }
.section-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: var(--radius-full); margin-bottom: 12px; }
.section-title { font-family: var(--font-serif); font-size: clamp(24px, 3vw, 36px); font-weight: 700; color: var(--text-primary); line-height: 1.25; margin-bottom: 12px; letter-spacing: -0.01em; }
.section-desc { font-size: 16px; color: var(--text-tertiary); max-width: 520px; margin: 0 auto; line-height: 1.7; }

/* Hero */
.hero { min-height: 100vh; display: flex; align-items: center; padding: 80px 24px 60px; background: var(--bg); position: relative; overflow: hidden; }
.hero-inner { max-width: 1200px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius-full); padding: 5px 14px; font-size: 12px; color: var(--text-tertiary); background: var(--surface); box-shadow: var(--shadow-xs); margin-bottom: 24px; }
.hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.3)} }
.hero-title { font-family: var(--font-serif); font-size: clamp(36px, 5vw, 56px); font-weight: 700; line-height: 1.15; color: var(--text-primary); margin-bottom: 20px; letter-spacing: -0.02em; }
.hero-title .highlight { color: var(--primary); }
.hero-subtitle { font-size: 17px; color: var(--text-secondary); line-height: 1.75; margin-bottom: 28px; max-width: 480px; }
.hero-cta { display: flex; gap: 16px; margin-bottom: 36px; flex-wrap: wrap; }
.hero-trust { display: flex; gap: 32px; flex-wrap: wrap; }
.trust-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-tertiary); font-weight: 500; }
.trust-icon { font-size: 16px; }
.hero-visual { position: relative; display: flex; justify-content: center; }
.hero-device { width: 300px; height: 360px; background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; position: relative; }
.device-screen { width: 220px; padding: 24px; text-align: center; }
.device-heart { font-size: 32px; color: var(--danger); margin-bottom: 8px; }
.device-hr { font-size: 48px; font-weight: 700; color: var(--text-primary); line-height: 1; }
.device-hr-label { font-size: 13px; color: var(--success); font-weight: 600; margin-top: 4px; }
.device-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); width: 100%; }
.device-stat-val { font-size: 18px; font-weight: 700; }
.device-stat-lbl { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.floating-card { position: absolute; background: var(--surface); border-radius: var(--radius-lg); padding: 10px 14px; box-shadow: var(--shadow-md); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 12px; animation: float 4s ease-in-out infinite; }
.floating-card .fc-icon { width: 28px; height: 28px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.fc1 { top: 10px; right: -30px; animation-delay: 0s; }
.fc1 .fc-icon { background: var(--success-light); color: var(--success); }
.fc2 { bottom: 40px; left: -40px; animation-delay: 1.5s; }
.fc2 .fc-icon { background: var(--info-light); color: var(--info); }
@keyframes float { 0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)} }

/* Product Card */
.products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.product-card { background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--border); padding: 24px; transition: all var(--transition-base); display: flex; flex-direction: column; }
.product-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.product-card.featured { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), var(--shadow-md); }
.product-tier { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 8px; }
.product-name { font-family: var(--font-serif); font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; line-height: 1.3; }
.product-price { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 20px; }
.product-price small { font-size: 13px; color: var(--text-tertiary); font-weight: 400; }
.product-features { flex: 1; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
.product-features li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.product-features li::before { content: '✓'; color: var(--primary); font-weight: 700; font-size: 12px; flex-shrink: 0; }
.product-btn { width: 100%; padding: 10px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; cursor: pointer; transition: all var(--transition-fast); text-align: center; }
.product-btn.primary { background: var(--primary); color: white; border: 1.5px solid var(--primary); }
.product-btn.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.product-btn.outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
.product-btn.outline:hover { background: var(--primary-50); }

/* Feature Card */
.features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.feature-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 24px; transition: all var(--transition-base); }
.feature-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.feature-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 20px; background: var(--primary-light); color: var(--primary); }
.feature-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.feature-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.7; }

/* Ecosystem Flow */
.ecosystem-flow { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.eco-node { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; text-align: center; min-width: 130px; transition: all var(--transition-base); }
.eco-node:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
.eco-node.cloud { border-color: var(--primary); background: var(--primary-50); }
.eco-icon { font-size: 28px; margin-bottom: 8px; }
.eco-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.eco-arrow { font-size: 20px; color: var(--border-strong); }

/* Testimonial */
.testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.testimonial-card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 24px; transition: all var(--transition-base); }
.testimonial-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.testimonial-stars { font-size: 14px; color: var(--warning); letter-spacing: 2px; margin-bottom: 16px; }
.testimonial-text { font-size: 14px; color: var(--text-secondary); line-height: 1.75; margin-bottom: 20px; font-style: italic; }
.testimonial-author { display: flex; align-items: center; gap: 16px; }
.testimonial-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.testimonial-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.testimonial-role { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* CTA */
.cta-section { background: var(--primary); color: white; text-align: center; padding: 96px 0; }
.cta-title { font-family: var(--font-serif); font-size: clamp(24px, 3vw, 36px); font-weight: 700; margin-bottom: 12px; letter-spacing: -0.01em; }
.cta-desc { font-size: 16px; opacity: 0.85; margin-bottom: 28px; max-width: 480px; margin-left: auto; margin-right: auto; line-height: 1.7; }
.cta-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.cta-trust { display: flex; gap: 32px; justify-content: center; margin-top: 32px; font-size: 13px; opacity: 0.7; }

/* Footer */
footer { background: var(--text-primary); color: rgba(255,255,255,0.6); padding: 64px 0 24px; }
.footer-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; margin-bottom: 32px; }
.footer-brand-name { font-size: 18px; font-weight: 700; color: white; font-family: var(--font-serif); margin-bottom: 8px; }
.footer-brand-desc { font-size: 13px; line-height: 1.7; color: rgba(255,255,255,0.5); max-width: 280px; }
.footer-col h4 { color: white; font-size: 13px; font-weight: 700; margin-bottom: 16px; letter-spacing: 0.02em; }
.footer-col ul { display: flex; flex-direction: column; gap: 10px; }
.footer-col a { color: rgba(255,255,255,0.5); font-size: 13px; transition: color var(--transition-fast); }
.footer-col a:hover { color: white; }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.35); flex-wrap: wrap; gap: 8px; }

/* Page Hero */
.page-hero { padding: 120px 0 60px; background: var(--surface); border-bottom: 1px solid var(--border); }
.page-hero-inner { max-width: 800px; margin: 0 auto; padding: 0 24px; text-align: center; }
.page-hero h1 { font-family: var(--font-serif); font-size: clamp(28px, 4vw, 44px); font-weight: 700; color: var(--text-primary); margin-bottom: 12px; letter-spacing: -0.02em; line-height: 1.2; }
.page-hero-desc { font-size: 17px; color: var(--text-tertiary); line-height: 1.7; }

/* Breadcrumb */
.breadcrumb { padding: 80px 0 0; }
.breadcrumb-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; font-size: 13px; color: var(--text-tertiary); display: flex; gap: 8px; align-items: center; }
.breadcrumb a { color: var(--text-tertiary); transition: color var(--transition-fast); }
.breadcrumb a:hover { color: var(--primary); }
.breadcrumb-sep { color: var(--border-strong); }

/* Page Content */
.page-content { padding: 64px 0; }
.page-content-inner { max-width: 800px; margin: 0 auto; padding: 0 24px; }
.page-content-inner h2 { font-family: var(--font-serif); font-size: 22px; font-weight: 700; color: var(--text-primary); margin-top: 40px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.page-content-inner h3 { font-size: 17px; font-weight: 700; color: var(--text-primary); margin-top: 32px; margin-bottom: 12px; }
.page-content-inner p { font-size: 15px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 16px; }
.page-content-inner ul { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.page-content-inner li { font-size: 15px; color: var(--text-secondary); line-height: 1.7; padding-left: 20px; position: relative; }
.page-content-inner li::before { content: ''; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--primary); }
.page-content-inner table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 14px; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); }
.page-content-inner th, .page-content-inner td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
.page-content-inner th { background: var(--surface-alt); font-weight: 600; color: var(--text-primary); font-size: 13px; }
.page-content-inner td { color: var(--text-secondary); }
.page-content-inner tbody tr:last-child td { border-bottom: none; }
.page-content-inner blockquote { border-left: 3px solid var(--primary); padding: 16px 20px; background: var(--primary-50); border-radius: 0 var(--radius-md) var(--radius-md) 0; margin: 24px 0; }
.page-content-inner blockquote p { color: var(--text-secondary); margin: 0; }
.page-content-inner code { font-family: var(--font-mono); font-size: 13px; background: var(--surface-alt); border: 1px solid var(--border); padding: 1px 6px; border-radius: var(--radius-sm); color: var(--primary-dark); }
.page-content-inner pre { background: var(--text-primary); color: rgba(255,255,255,0.85); padding: 24px; border-radius: var(--radius-lg); overflow-x: auto; margin: 24px 0; font-size: 13px; line-height: 1.6; }
.page-content-inner pre code { background: transparent; border: none; padding: 0; color: inherit; }
.page-content-inner hr { border: none; height: 1px; background: var(--border); margin: 40px 0; }

/* About Page Extras */
.about-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 40px 0; }
.about-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; text-align: center; transition: all var(--transition-base); }
.about-stat:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.about-stat-value { font-family: var(--font-serif); font-size: 32px; font-weight: 700; color: var(--primary); line-height: 1; }
.about-stat-label { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; }
.values-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 24px 0; }
.value-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; transition: all var(--transition-base); }
.value-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.value-card-icon { font-size: 24px; margin-bottom: 12px; }
.value-card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.value-card-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.7; }
.timeline { position: relative; padding-left: 24px; margin: 24px 0; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 1.5px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 24px; }
.timeline-item::before { content: ''; position: absolute; left: -21px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg); }
.timeline-item:first-child::before { border-color: var(--primary); }
.timeline-date { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.timeline-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.timeline-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.6; }

/* Product Page Extras */
.product-card-visual { height: 200px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.product-emoji { font-size: 72px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
.product-card-body { padding: 24px; }
.product-card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--border); }
.feature-tag { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-full); background: var(--surface-alt); color: var(--text-secondary); font-weight: 500; border: 1px solid var(--border); }
.comparison-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); font-size: 14px; }
.comparison-table th, .comparison-table td { padding: 14px 18px; text-align: center; border-bottom: 1px solid var(--border); }
.comparison-table th:first-child, .comparison-table td:first-child { text-align: left; font-weight: 600; color: var(--text-primary); background: var(--surface-alt); min-width: 140px; }
.comparison-table th { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.comparison-table th.starter { color: var(--success); }
.comparison-table th.plus { color: var(--primary); }
.comparison-table th.pro { color: var(--warning); }
.comparison-table tbody tr:last-child td { border-bottom: none; }
.comparison-table tbody tr:hover { background: var(--primary-50); }
.check { color: var(--success); font-weight: 700; font-size: 16px; }
.cross { color: var(--border-strong); font-size: 16px; }

/* Fade-in */
.fade-in { opacity: 0; transform: translateY(16px); transition: opacity 0.4s ease, transform 0.4s ease; }
.fade-in.visible { opacity: 1; transform: none; }

/* Responsive */
@media (max-width: 1024px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) {
  .hero-inner { grid-template-columns: 1fr !important; }
  .hero-visual { display: none; }
  .hero-title { font-size: 32px !important; }
  .features-grid, .testimonials-grid { grid-template-columns: 1fr !important; }
  .products-grid { grid-template-columns: 1fr !important; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .nav-links { display: none; }
  .section { padding: 64px 0; }
  .ecosystem-flow { flex-direction: column; }
  .eco-arrow { transform: rotate(90deg); }
  .about-stats { grid-template-columns: repeat(2, 1fr); }
  .values-grid { grid-template-columns: 1fr; }
}
@media print { body { font-family: 'Noto Serif SC', serif; } }
  </style>
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
