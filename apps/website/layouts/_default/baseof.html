<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} | {{ .Site.Title }}</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="keywords" content="颐贞,Eregen,老年健康,智能手环,药盒管理,居家养老,健康监测">
  <meta name="author" content="Eregen Team">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ .Title }} - {{ .Site.Title }}">
  <meta property="og:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:image" content="https://eregen.com/images/hero-preview.jpg">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Params.brandName }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }} - {{ .Site.Title }}">
  <meta name="twitter:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="https://eregen.com/images/hero-preview.jpg">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

  <!-- Google Fonts — Inter (primary) + Noto Sans SC + Noto Serif SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Curative × Eregen Design System CSS -->
  {{ $styles := resources.Get "css/curative-styles.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">

  <!-- Hope UI × Eregen Brand Layer (overrides Curative blue → Hope UI blue-purple) -->
  {{ $hopeStyles := resources.Get "css/hope-ui-styles.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $hopeStyles.RelPermalink }}" integrity="{{ $hopeStyles.Data.Integrity }}">
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
