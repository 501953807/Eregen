{{ define "main" }}
<div class="breadcrumb">
  <div class="breadcrumb-inner">
    <a href="/">首页</a>
    <span class="breadcrumb-sep">&#8594;</span>
    <span>{{ .Title }}</span>
  </div>
</div>
<div class="page-hero">
  <div class="page-hero-inner fade-in">
    <h1>{{ .Title }}</h1>
    {{ if .Params.description }}<p class="page-hero-desc">{{ .Params.description }}</p>{{ end }}
  </div>
</div>
<div class="page-content">
  <div class="page-content-inner">
    {{ .Content }}
  </div>
</div>
{{ end }}
