; PlatformIO Project Configuration File
; Eregen (颐贞) Firmware Development
; Usage: pio run -e <env>  or  pio run -e all

[platformio]
src_dir = firmware
default_envs = pillbox_auto, pillbox_smart, pillbox_basic, wristband_medical, wristband_community, bracelet_entry

[env:esp32c3]
platform = espressif32 @ 6.6.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCONFIG_IDF_TARGET_ESP32C3
    -Wall
    -Wextra
    -O2
    -DAPP_VERSION="\"1.0.0-dev\""

[env:esp32s3]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCONFIG_IDF_TARGET_ESP32S3
    -Wall
    -Wextra
    -O2
    -DAPP_VERSION="\"1.0.0-dev\""

[env:bracelet_entry]
platform = ststm32 @ 12.2.0
board = genericSTM32F103C8
framework = stm32cube
monitor_speed = 115200
upload_protocol = stlink
build_flags =
    -DDEVICE_TYPE_BRACELET_ENTRY
    -Wall
    -Wextra
    -O2

; ---- Specific firmware targets ----

[env:pillbox_basic]
extends = env:esp32c3
src_dir = firmware/pillbox/basic
project_name = eregen_pillbox_basic

[env:pillbox_smart]
extends = env:esp32c3
src_dir = firmware/pillbox/smart
project_name = eregen_pillbox_smart

[env:pillbox_auto]
extends = env:esp32c3
src_dir = firmware/pillbox/auto
project_name = eregen_pillbox_auto

[env:wristband_medical]
extends = env:esp32s3
src_dir = firmware/medical-wristband/esp32s3/main
project_name = eregen_medical_wristband

[env:wristband_community]
extends = env:esp32s3
src_dir = firmware/medical-wristband/community/esp32s3/main
project_name = eregen_community_wristband

[env:bracelet_entry]
extends = env:bracelet_entry
src_dir = firmware/bracelet/entry
project_name = eregen_bracelet_entry

; ---- Common library ----
[env:common_lib]
extends = env:esp32c3
src_dir = firmware/common
platform_packages =
    framework-espidf @ https://github.com/espressif/esp-idf/releases/download/v5.3/esp-idf-v5.3.zip
project_name = eregen_common
build_type = library
